<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 288px; margin: 0; font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
           background: #0d0d10; color: #f5f5f7; font-size: 13px; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { color: #8e8e93; font-size: 12px; margin-bottom: 12px; }
    .status { background: #16161b; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
              padding: 10px; font-size: 12px; margin-bottom: 12px; }
    .status.ok { border-color: rgba(48,209,88,0.4); }
    .status.warn { border-color: rgba(255,214,10,0.4); color: #ffd60a; }
    .row { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
    .row label { flex: 1; }
    input[type=checkbox] { width: 16px; height: 16px; accent-color: #30d158; }
    button { background: #f5f5f7; color: #000; border: none; border-radius: 9px;
             padding: 9px; font-weight: 700; cursor: pointer; width: 100%; font-size: 13px; }
    a { color: #64a8ff; text-decoration: none; font-size: 12px; }
    .hint { color: #8e8e93; font-size: 11.5px; margin-top: 12px; line-height: 1.5; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 12px 0; }
  </style>
</head>
<body>
  <h1>⚡ Auto Apply Autofill</h1>
  <div class="sub">Fills Google Forms from your profile.</div>
  <div id="status" class="status">Checking…</div>
  <button id="sync">↻ Reload profile from app</button>
  <hr />
  <div class="row"><label for="autofill">Autofill forms when they open</label><input type="checkbox" id="autofill" /></div>
  <div class="row"><label for="highlight">Highlight required fields left blank</label><input type="checkbox" id="highlight" /></div>
  <div class="row"><label for="autosubmit">Auto-submit when everything is filled</label><input type="checkbox" id="autosubmit" /></div>
  <div class="hint">
    Open a Google Form and use the ⚡ panel at the bottom-right to fill it — even sign-in forms,
    because it runs in your logged-in browser. Keep the Auto Apply app open and signed in so your
    profile stays in sync. <a href="http://127.0.0.1:8787" target="_blank">Open Auto Apply →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
