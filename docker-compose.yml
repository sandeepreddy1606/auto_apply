# Runs the app + Caddy (automatic HTTPS) on a VM.
# Create a `.env` next to this file with:
#   DATABASE_URL=postgresql://...neon...       (your Neon connection string)
#   DOMAIN=your-name.duckdns.org                (a domain pointing at this VM)
# then:  docker compose up -d --build

services:
  app:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTO_APPLY_DATA_DIR=/data
      - PORT=8787
    volumes:
      - aa_data:/data
    restart: unless-stopped
    expose:
      - "8787"

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  aa_data:
  caddy_data:
  caddy_config:
